name: Build Go Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/go-setup@v5
      with:
        go-version: '1.22'

    - name: Build Windows Executable
      run: |
        go build -o cs2go.exe main.go memory.go

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cs2go-binary
        path: cs2go.exe
